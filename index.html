<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central FL Industrial — Parcel Map</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-1:#fcfcfb; --surface-2:#f0efec; --border:#dddcd6;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#8a897f;
    --series-1:#2a78d6;  /* warehousing / storage */
    --series-3:#1baf7a;  /* manufacturing / processing */
    --accent:#eb6834;    /* sold in past 12 months */
    --neutral-mark:#b9b8ae; /* vacant industrial land */
    --sel:#4a3aa7;
    --bad:#c0392b;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:#1a1a19; --surface-2:#262624; --border:#3a3a37;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8a897f;
    --series-1:#3987e5; --series-3:#199e70; --accent:#d95926;
    --neutral-mark:#5c5b55; --sel:#9085e9;
    --bad:#e0604a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
              background:var(--surface-1); color:var(--text-primary); }
  #app { display:flex; flex-direction:column; height:100%; }

  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--border);
           background:var(--surface-1); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:650; }
  #stats { display:flex; gap:22px; margin-left:auto; }
  .stat { text-align:right; }
  .stat b { display:block; font-size:17px; font-variant-numeric:tabular-nums; }
  .stat span { font-size:11px; color:var(--text-secondary); }
  #themeBtn,#tableBtn,#csvBtn,#satBtn { border:1px solid var(--border); background:var(--surface-2); color:var(--text-primary);
           border-radius:7px; padding:5px 11px; cursor:pointer; font-size:12.5px; }
  #satBtn.on { border-color:var(--sel); color:var(--sel); font-weight:600; }

  #filters { display:flex; gap:10px; padding:8px 16px; border-bottom:1px solid var(--border);
             background:var(--surface-1); flex-wrap:wrap; align-items:flex-end; }
  .f { display:flex; flex-direction:column; gap:3px; }
  .f label { font-size:10.5px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.04em; }
  .f input,.f select { border:1px solid var(--border); background:var(--surface-1); color:var(--text-primary);
             border-radius:6px; padding:5px 8px; font-size:13px; }
  .f input[type=number] { width:78px; } .f input[type=date] { width:130px; }
  #ownerQ { width:210px; } #cityQ { width:130px; }
  .county-chips { display:flex; gap:4px; flex-wrap:wrap; max-width:330px; }
  .chip { border:1px solid var(--border); border-radius:12px; padding:2.5px 9px; font-size:12px; cursor:pointer;
          background:var(--surface-1); color:var(--text-secondary); user-select:none; }
  .chip.on { background:var(--surface-2); color:var(--text-primary); border-color:var(--text-muted); font-weight:600; }
  #clearBtn { color:var(--text-secondary); background:none; border:none; cursor:pointer; font-size:12px; text-decoration:underline; }
  #portfolioChip { display:none; align-items:center; gap:7px; border:1.5px solid var(--sel); color:var(--sel);
          border-radius:12px; padding:2.5px 10px; font-size:12px; font-weight:600; cursor:pointer; background:var(--surface-1); }
  #portfolioChip.on { display:inline-flex; }

  #main { flex:1; display:flex; min-height:0; position:relative; }
  #map { flex:1; }

  #legend { position:absolute; left:12px; bottom:26px; background:var(--surface-1); border:1px solid var(--border);
            border-radius:9px; padding:10px 13px; font-size:12.5px; z-index:5; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .lg { display:flex; align-items:center; gap:8px; margin:3px 0; color:var(--text-secondary); }
  .sw { width:14px; height:14px; border-radius:4px; flex:none; }
  .sw.ring { background:transparent; border:2.5px solid var(--accent); }

  #tip { position:absolute; pointer-events:none; background:var(--surface-1); border:1px solid var(--border);
         border-radius:8px; padding:7px 10px; font-size:12.5px; z-index:20; display:none; max-width:280px;
         box-shadow:0 3px 12px rgba(0,0,0,.18); }
  #tip b { display:block; } #tip .mut { color:var(--text-secondary); font-size:11.5px; }

  #panel { width:0; transition:width .18s; overflow:hidden; border-left:1px solid var(--border); background:var(--surface-1); }
  #panel.open { width:370px; overflow-y:auto; }
  #panel .inner { padding:14px 16px 24px; width:370px; }
  #panel h2 { font-size:15px; margin:2px 0 1px; }
  #panel .sub { color:var(--text-secondary); font-size:12.5px; margin-bottom:9px; }
  #panel .close { float:right; border:none; background:none; color:var(--text-secondary); font-size:17px; cursor:pointer; }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:3px 10px; font-size:13px; margin:10px 0; }
  .kv div:nth-child(odd) { color:var(--text-secondary); }
  .kv div { min-width:0; overflow-wrap:break-word; }
  #panel h3 { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-secondary); margin:16px 0 6px; }
  table.mini { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.mini th { text-align:left; color:var(--text-secondary); font-weight:500; border-bottom:1px solid var(--border);
                  padding:3px 6px 3px 0; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  table.mini td { padding:4px 6px 4px 0; border-bottom:1px solid var(--surface-2); vertical-align:top; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; font-size:10.5px; border:1px solid var(--border); border-radius:9px; padding:0 7px;
          color:var(--text-secondary); }
  .pill.bad { color:var(--bad); border-color:var(--bad); font-weight:600; }
  .pill.warn { color:var(--accent); border-color:var(--accent); }
  .clusterBox { border:1px solid var(--border); border-left:3px solid var(--sel); border-radius:8px;
          padding:9px 11px; margin:8px 0; background:var(--surface-2); font-size:12.8px; }
  .clusterBox b { display:block; margin-bottom:2px; }
  .portBtn { margin-top:7px; border:1.5px solid var(--sel); color:var(--sel); background:var(--surface-1);
          border-radius:7px; padding:5px 10px; cursor:pointer; font-size:12.5px; font-weight:600; width:100%; }
  .portBtn:hover { background:var(--sel); color:var(--surface-1); }

  #tableView { position:absolute; inset:0; background:var(--surface-1); z-index:10; display:none; flex-direction:column; }
  #tableView.open { display:flex; }
  #tableView .bar { padding:8px 16px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:center; }
  #tableWrap { flex:1; overflow:auto; padding:0 16px 16px; }
  #tableWrap table { width:100%; border-collapse:collapse; font-size:12.8px; }
  #tableWrap th { position:sticky; top:0; background:var(--surface-1); text-align:left; padding:8px 10px 6px 0;
                  border-bottom:1px solid var(--border); color:var(--text-secondary); font-size:11px;
                  text-transform:uppercase; letter-spacing:.04em; cursor:pointer; white-space:nowrap; }
  #tableWrap td { padding:5px 10px 5px 0; border-bottom:1px solid var(--surface-2); white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; max-width:230px; }
  #tableWrap tr:hover td { background:var(--surface-2); cursor:pointer; }

  #loading { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:var(--surface-1);
             border:1px solid var(--border); border-radius:8px; padding:6px 14px; font-size:12.5px; z-index:30;
             color:var(--text-secondary); box-shadow:0 2px 8px rgba(0,0,0,.12); }
  a { color:var(--series-1); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Central FL Industrial Parcels</h1>
    <button id="tableBtn">Table view</button>
    <button id="csvBtn">Export CSV</button>
    <button id="satBtn">🛰 Satellite</button>
    <button id="themeBtn">◐ Theme</button>
    <div id="stats">
      <div class="stat"><b id="stN">–</b><span>parcels shown</span></div>
      <div class="stat"><b id="stS">–</b><span>sold past 12 mo</span></div>
      <div class="stat"><b id="stV">–</b><span>median $/SF (12 mo sales)</span></div>
      <div class="stat"><b id="stA">–</b><span>total acres</span></div>
    </div>
  </header>

  <div id="filters">
    <div class="f"><label>Counties</label><div class="county-chips" id="countyChips"></div></div>
    <div class="f"><label>City</label><input id="cityQ" list="cityList" placeholder="Any city"><datalist id="cityList"></datalist></div>
    <div class="f"><label>Use</label>
      <select id="useSel">
        <option value="">All industrial</option>
        <option value="wh">Warehousing / storage (048–049)</option>
        <option value="mfg">Manufacturing / processing (041–047)</option>
        <option value="vac">Vacant industrial (040)</option>
      </select></div>
    <div class="f"><label>Bldg SF</label><div style="display:flex;gap:4px"><input type="number" id="bMin" placeholder="min"><input type="number" id="bMax" placeholder="max"></div></div>
    <div class="f"><label>Acres</label><div style="display:flex;gap:4px"><input type="number" id="aMin" placeholder="min" step="0.5"><input type="number" id="aMax" placeholder="max" step="0.5"></div></div>
    <div class="f"><label>Sold after</label><input type="date" id="soldAfter"></div>
    <div class="f"><label>Sale price</label><div style="display:flex;gap:4px"><input type="number" id="pMin" placeholder="min $"><input type="number" id="pMax" placeholder="max $"></div></div>
    <div class="f"><label>Owner / principal / cluster</label><input id="ownerQ" placeholder="e.g. PROLOGIS, PETHERBRIDGE"></div>
    <span id="portfolioChip" title="Click to clear portfolio filter"></span>
    <button id="clearBtn">clear all</button>
  </div>

  <div id="main">
    <div id="map"></div>
    <div id="legend">
      <div class="lg"><span class="sw" style="background:var(--series-1)"></span>Warehousing / storage</div>
      <div class="lg"><span class="sw" style="background:var(--series-3)"></span>Manufacturing / processing</div>
      <div class="lg"><span class="sw" style="background:var(--neutral-mark)"></span>Vacant industrial land</div>
      <div class="lg"><span class="sw ring"></span>Sold in past 12 months</div>
    </div>
    <div id="tip"></div>
    <div id="panel"><div class="inner" id="panelInner"></div></div>
    <div id="tableView">
      <div class="bar"><b id="tvCount"></b><span style="color:var(--text-secondary)">click a row to open on the map</span>
        <button id="tvClose" style="margin-left:auto" class="chip">Back to map</button></div>
      <div id="tableWrap"></div>
    </div>
    <div id="loading">Loading parcels…</div>
  </div>
</div>

<script>
const SB = "https://oyagxyjxyjxocsdkxarc.supabase.co/rest/v1";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95YWd4eWp4eWp4b2NzZGt4YXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODkzNDYsImV4cCI6MjEwMTg2NTM0Nn0.mR4JCq7u-s4qJGaPNfuAsdj2b3IQUi70V6iuBkwWzao";
const H = { apikey: KEY, Authorization: "Bearer " + KEY };
const USE_NAMES = {"040":"Vacant industrial","041":"Light manufacturing","042":"Heavy industrial",
  "043":"Lumber yard / sawmill","044":"Packing plant","045":"Cannery / bottler","046":"Food processing",
  "047":"Mineral processing","048":"Warehousing / distribution","049":"Open storage"};
const useGroup = uc => uc === "040" ? "vac" : (uc >= "048" ? "wh" : "mfg");
const fmt$ = v => v == null ? "—" : "$" + Math.round(v).toLocaleString();
const fmtN = v => v == null ? "—" : Math.round(v).toLocaleString();
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CUTOFF = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
// same normalization as the DB: upper(regexp_replace(owner_name,'[^A-Za-z0-9 ]','','g'))
const norm = s => (s ?? "").toUpperCase().replace(/[^A-Z0-9 ]/g, "");

let parcels = [];                 // all rows from dash_parcels
let byKey = new Map();
let ownerMatchKeys = null;        // Set of parcel_key from alias search, or null
let ownerMatchNorms = null;       // Set of owner_norm from Sunbiz principal/cluster search, or null
let selectedKey = null;

let entities = new Map();         // owner_norm -> dash_entities row
let groups = new Map();           // group_id -> { label, members:[owner_norm], hidden }
let entReady = false, entFailed = false;
let portfolioGid = null;          // active "entire portfolio" cluster filter
let panelKey = null;              // parcel currently open in the side panel

// ---------- theme ----------
let theme = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;
document.getElementById("themeBtn").onclick = () => {
  theme = theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("theme", theme);
  applyBasemap(theme); refreshPaint();
};

// ---------- map ----------
let sat = localStorage.getItem("basemap") === "sat";
const CARTO_TILES = t => ["a","b","c","d"].map(s => `https://${s}.basemaps.cartocdn.com/${t==="dark"?"dark_all":"light_all"}/{z}/{x}/{y}@2x.png`);
const ESRI_TILES = ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"];
const LABEL_TILES = ["a","b","c","d"].map(s => `https://${s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}@2x.png`);
const ATTR = "© OpenStreetMap contributors © CARTO · Imagery © Esri, Maxar, Earthstar Geographics";
const basemap = t => ({
  version: 8,
  sources: {
    carto: { type: "raster", tiles: sat ? ESRI_TILES : CARTO_TILES(t), tileSize: 256, attribution: ATTR },
    labels: { type: "raster", tiles: LABEL_TILES, tileSize: 256 }
  },
  layers: [
    { id: "carto", type: "raster", source: "carto" },
    { id: "sat-labels", type: "raster", source: "labels", layout: { visibility: sat ? "visible" : "none" } }
  ]
});
const map = new maplibregl.Map({ container: "map", style: basemap(theme),
  center: [-81.4, 28.6], zoom: 8.4, attributionControl: { compact: true } });
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
function applyBasemap(t) {
  const src = map.getSource("carto");
  src && src.setTiles(sat ? ESRI_TILES : CARTO_TILES(t));
  map.getLayer("sat-labels") && map.setLayoutProperty("sat-labels", "visibility", sat ? "visible" : "none");
}
const satBtn = document.getElementById("satBtn");
satBtn.classList.toggle("on", sat);
satBtn.onclick = () => {
  sat = !sat;
  localStorage.setItem("basemap", sat ? "sat" : "map");
  satBtn.classList.toggle("on", sat);
  applyBasemap(theme);
};

// ---------- data loading ----------
async function pageAll(path, params, orderCol) {
  // an explicit order makes Range paging deterministic — without it PostgREST
  // may return overlapping/missing rows across pages
  params += `&order=${orderCol || "parcel_key"}`;
  const out = []; let from = 0, page = 1000;
  while (true) {
    const r = await fetch(`${SB}/${path}?${params}`, { headers: { ...H, Range: `${from}-${from + page - 1}` } });
    if (!r.ok) throw new Error(path + " " + r.status);
    const rows = await r.json();
    out.push(...rows);
    if (rows.length < page) break;
    from += page;
  }
  return out;
}

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function featProps(p) {
  return { k: p.parcel_key, g: p._g, r: p._recent ? 1 : 0,
           sel: p.parcel_key === selectedKey ? 1 : 0, d: p._dim ? 1 : 0,
           pf: portfolioGid != null && p._match ? 1 : 0 };   // portfolio member — distinct color
}
function pointFC() {
  return { type: "FeatureCollection", features: parcels.filter(p => p._show).map(p => ({
    type: "Feature", geometry: { type: "Point", coordinates: [p.lon, p.lat] }, properties: featProps(p) })) };
}
let polyIndex = new Map();  // parcel_key -> geometry
function polyFC() {
  return { type: "FeatureCollection", features: parcels.filter(p => p._show && polyIndex.has(p.parcel_key)).map(p => ({
    type: "Feature", geometry: polyIndex.get(p.parcel_key), properties: featProps(p) })) };
}

function colorExpr() {
  // portfolio members get the distinct highlight color; dimmed parcels lose their
  // use-color entirely so the portfolio stands out
  return ["case",
    ["==", ["get","pf"], 1], cssVar("--sel"),
    ["==", ["get","d"], 1], cssVar("--neutral-mark"),
    ["match", ["get", "g"], "wh", cssVar("--series-1"), "mfg", cssVar("--series-3"), cssVar("--neutral-mark")]];
}
const dimExpr = (lo, hi) => ["case", ["==", ["get","d"], 1], lo, hi];
function strokeExpr() {
  return ["case", ["==", ["get","sel"], 1], cssVar("--sel"),
          ["==", ["get","pf"], 1], cssVar("--surface-1"),
          ["==", ["get","r"], 1], cssVar("--accent"), "rgba(0,0,0,0)"];
}
function lineColorExpr() {
  return ["case", ["==", ["get","sel"], 1], cssVar("--sel"),
          ["==", ["get","pf"], 1], cssVar("--sel"),
          ["==", ["get","r"], 1], cssVar("--accent"), colorExpr()];
}

function addLayers() {
  map.addSource("pts", { type: "geojson", data: pointFC() });
  map.addSource("polys", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "poly-fill", type: "fill", source: "polys", minzoom: 12,
    paint: { "fill-color": colorExpr(),
             "fill-opacity": ["case", ["==", ["get","pf"], 1], 0.6, ["==", ["get","d"], 1], 0.07, 0.42] } });
  map.addLayer({ id: "poly-line", type: "line", source: "polys", minzoom: 12,
    paint: { "line-color": lineColorExpr(),
             "line-width": ["case", ["==", ["get","sel"], 1], 3.5, ["==", ["get","pf"], 1], 2.5, ["==", ["get","r"], 1], 2.5, 1],
             "line-opacity": dimExpr(0.15, 1) } });
  map.addLayer({ id: "pt-circ", type: "circle", source: "pts", maxzoom: 12,
    paint: { "circle-color": colorExpr(),
      "circle-radius": ["interpolate", ["linear"], ["zoom"],
        8, ["case", ["==", ["get","pf"], 1], 4.5, 2.4],
        12, ["case", ["==", ["get","pf"], 1], 9, 5]],
      "circle-opacity": ["case", ["==", ["get","pf"], 1], 1, ["==", ["get","d"], 1], 0.15, 0.92],
      "circle-stroke-color": strokeExpr(),
      "circle-stroke-opacity": dimExpr(0.15, 1),
      "circle-stroke-width": ["case", ["==", ["get","sel"], 1], 3, ["==", ["get","pf"], 1], 1.5, ["==", ["get","r"], 1], 2, 0] } });
}
function refreshPaint() {
  if (!map.getLayer("pt-circ")) return;
  map.setPaintProperty("pt-circ", "circle-color", colorExpr());
  map.setPaintProperty("pt-circ", "circle-stroke-color", strokeExpr());
  map.setPaintProperty("poly-fill", "fill-color", colorExpr());
  map.setPaintProperty("poly-line", "line-color", lineColorExpr());
}
function refreshSources() {
  map.getSource("pts") && map.getSource("pts").setData(pointFC());
  map.getSource("polys") && map.getSource("polys").setData(polyFC());
}

async function boot() {
  const rows = await pageAll("dash_parcels",
    "select=parcel_key,county,parcel_id_raw,dor_uc,owner_name,owner_addr,site_addr,site_city,site_zip,just_value,land_sqft,bldg_sqft,year_built,last_sale_date,last_sale_price,lon,lat");
  parcels = rows.filter(p => p.lon != null);
  parcels.forEach(p => { p._g = useGroup(p.dor_uc); p._recent = p.last_sale_date && p.last_sale_date >= CUTOFF;
    p._acres = p.land_sqft ? p.land_sqft / 43560 : null; p._norm = norm(p.owner_name); byKey.set(p.parcel_key, p); });
  buildFilterUI();
  applyFilters();
  // map.loaded() stays false while basemap tiles stream (slow on satellite), even
  // after "load" has fired — guard by layer presence and hook both paths
  const ensureLayers = () => {
    if (map.getSource("pts")) return;
    try { addLayers(); }                       // throws while the style is still loading
    catch (e) { setTimeout(ensureLayers, 300); }
  };
  map.on("load", ensureLayers);
  ensureLayers();
  loadEntities();   // background — ownership layer
  document.getElementById("loading").textContent = "Loading parcel outlines…";
  try {
    const geoms = await pageAll("dash_geoms", "select=parcel_key,gj");
    geoms.forEach(g => polyIndex.set(g.parcel_key, JSON.parse(g.gj)));
    if (map.getSource("polys")) refreshSources();   // else addLayers picks them up at creation
  } catch (e) { console.warn("geoms", e); }
  document.getElementById("loading").style.display = "none";
}

async function loadEntities() {
  try {
    const [ents, members] = await Promise.all([
      pageAll("dash_entities", "select=owner_norm,matched_name,status,date_filed,principal_addr,registered_agent,principals,group_id,group_label,hidden_link", "owner_norm"),
      pageAll("dash_group_members", "select=group_id,group_label,owner_norm", "owner_norm")
    ]);
    ents.forEach(e => {
      // searchable blob: entity name, cluster label, all principal names (not the RA — noise)
      const pn = Array.isArray(e.principals) ? e.principals.map(x => x && x.name || "").join(" ") : "";
      e._blob = [e.matched_name, e.owner_norm, e.group_label, pn].join(" ").toUpperCase();
      entities.set(e.owner_norm, e);
    });
    members.forEach(m => {
      let g = groups.get(m.group_id);
      if (!g) { g = { label: m.group_label, members: [], hidden: false }; groups.set(m.group_id, g); }
      g.members.push(m.owner_norm);
    });
    entities.forEach(e => { if (e.group_id != null && e.hidden_link && groups.has(e.group_id)) groups.get(e.group_id).hidden = true; });
    entReady = true;
  } catch (e) { entFailed = true; console.warn("entities", e); }
  if (panelKey) renderOwnership(byKey.get(panelKey));   // panel opened before entities arrived
  if (document.getElementById("ownerQ").value.trim().length >= 3) runOwnerSearch();
}

// ---------- filters ----------
const COUNTIES = ["Orange","Polk","Volusia","Seminole","Lake","Osceola"];
const active = new Set(COUNTIES);
function buildFilterUI() {
  const cc = document.getElementById("countyChips");
  COUNTIES.forEach(c => {
    const el = document.createElement("span"); el.className = "chip on"; el.textContent = c;
    el.onclick = () => { el.classList.toggle("on"); el.classList.contains("on") ? active.add(c) : active.delete(c); applyFilters(); };
    cc.appendChild(el);
  });
  const cities = [...new Set(parcels.map(p => (p.site_city || "").trim().toUpperCase()).filter(Boolean))].sort();
  document.getElementById("cityList").innerHTML = cities.map(c => `<option value="${esc(c)}">`).join("");
}
const val = id => document.getElementById(id).value;
function applyFilters() {
  const city = val("cityQ").trim().toUpperCase(), use = val("useSel"),
        bMin = +val("bMin") || 0, bMax = +val("bMax") || Infinity,
        aMin = +val("aMin") || 0, aMax = +val("aMax") || Infinity,
        sold = val("soldAfter"), pMin = +val("pMin") || 0, pMax = +val("pMax") || Infinity,
        oq = val("ownerQ").trim().toUpperCase();
  const portNorms = portfolioGid != null && groups.has(portfolioGid)
        ? new Set(groups.get(portfolioGid).members) : null;
  const highlighting = !!oq || !!portNorms;   // highlight matches, dim the rest
  let n = 0, s = 0, acres = 0, ppsf = [];
  parcels.forEach(p => {
    let ok = active.has(p.county);
    if (ok && city) ok = (p.site_city || "").toUpperCase().includes(city);
    if (ok && use) ok = p._g === use;
    if (ok && (bMin || bMax < Infinity)) ok = (p.bldg_sqft || 0) >= bMin && (p.bldg_sqft || 0) <= bMax;
    if (ok && (aMin || aMax < Infinity)) ok = (p._acres || 0) >= aMin && (p._acres || 0) <= aMax;
    if (ok && sold) ok = p.last_sale_date && p.last_sale_date >= sold;
    if (ok && (pMin || pMax < Infinity)) ok = p.last_sale_price != null && p.last_sale_price >= pMin && p.last_sale_price <= pMax;
    p._show = ok;
    let match = ok;
    if (ok && highlighting) {
      match = false;
      if (portNorms) match = portNorms.has(p._norm);
      else match = ((p.owner_name || "").toUpperCase().includes(oq))
                 || (ownerMatchKeys && ownerMatchKeys.has(p.parcel_key))
                 || (ownerMatchNorms && ownerMatchNorms.has(p._norm));
    }
    p._dim = ok && !match;
    p._match = match;
    if (match) { n++; acres += p._acres || 0;
      if (p._recent) { s++; if (p.last_sale_price > 1000 && p.bldg_sqft > 1000) ppsf.push(p.last_sale_price / p.bldg_sqft); } }
  });
  document.getElementById("stN").textContent = n.toLocaleString();
  document.getElementById("stS").textContent = s.toLocaleString();
  ppsf.sort((a, b) => a - b);
  document.getElementById("stV").textContent = ppsf.length ? "$" + ppsf[Math.floor(ppsf.length / 2)].toFixed(0) : "—";
  document.getElementById("stA").textContent = Math.round(acres).toLocaleString();
  refreshSources();
  if (document.getElementById("tableView").classList.contains("open")) renderTable();
  return n;
}
["cityQ","useSel","bMin","bMax","aMin","aMax","soldAfter","pMin","pMax"].forEach(id =>
  document.getElementById(id).addEventListener("input", debounce(applyFilters, 250)));
function debounce(f, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; }

// ---------- unified owner search: roll owner + aliases + Sunbiz principals + cluster labels ----------
async function runOwnerSearch() {
  const q = val("ownerQ").trim();
  if (q.length < 3) { ownerMatchKeys = null; ownerMatchNorms = null; applyFilters(); return; }
  const Q = q.toUpperCase();
  // Sunbiz principals + entity names + cluster labels (client-side over the cached 1.7k entities).
  // A hit on a clustered entity expands to the holder's whole group, so a principal search
  // (e.g. PETHERBRIDGE) lights up the same parcels as the cluster itself.
  const norms = new Set();
  entities.forEach(e => {
    if (e._blob.includes(Q)) {
      if (e.group_id != null && groups.has(e.group_id)) groups.get(e.group_id).members.forEach(m => norms.add(m));
      else norms.add(e.owner_norm);
    }
  });
  ownerMatchNorms = norms.size ? norms : null;
  // recorded aliases (server-side ilike)
  try {
    const r = await fetch(`${SB}/dash_owners?select=parcel_key&name_raw=ilike.*${encodeURIComponent(q)}*&limit=2000`, { headers: H });
    ownerMatchKeys = new Set((await r.json()).map(x => x.parcel_key));
  } catch { ownerMatchKeys = null; }
  applyFilters();
}
let ownerTimer;
document.getElementById("ownerQ").addEventListener("input", () => {
  clearTimeout(ownerTimer);
  if (portfolioGid != null) setPortfolio(null, true);   // typing a search replaces portfolio mode
  ownerTimer = setTimeout(runOwnerSearch, 350);
});

// ---------- portfolio (ownership cluster) filter ----------
function setPortfolio(gid, skipApply) {
  portfolioGid = gid;
  const chip = document.getElementById("portfolioChip");
  if (gid != null && groups.has(gid)) {
    chip.textContent = "Portfolio: " + (groups.get(gid).label || "cluster " + gid) + "  ✕";
    chip.classList.add("on");
  } else { chip.classList.remove("on"); }
  if (!skipApply) applyFilters();
}
document.getElementById("portfolioChip").onclick = () => setPortfolio(null);
window.showPortfolio = gid => {
  document.getElementById("ownerQ").value = "";
  ownerMatchKeys = null; ownerMatchNorms = null;
  setPortfolio(gid);
  const pts = parcels.filter(p => p._match && p.lon != null);
  if (pts.length) {
    const b = new maplibregl.LngLatBounds();
    pts.forEach(p => b.extend([p.lon, p.lat]));
    // let the layout settle (panel width transition), then fit the whole portfolio
    setTimeout(() => { map.resize();
      map.fitBounds(b, { padding: 80, maxZoom: 14, duration: 900 }); }, 220);
  }
};

document.getElementById("clearBtn").onclick = () => {
  ["cityQ","useSel","bMin","bMax","aMin","aMax","soldAfter","pMin","pMax","ownerQ"].forEach(id => document.getElementById(id).value = "");
  ownerMatchKeys = null; ownerMatchNorms = null; setPortfolio(null, true);
  active.clear(); COUNTIES.forEach(c => active.add(c));
  document.querySelectorAll("#countyChips .chip").forEach(c => c.classList.add("on"));
  applyFilters();
};

// ---------- hover tooltip ----------
const tip = document.getElementById("tip");
function showTip(e, p) {
  tip.innerHTML = `<b>${esc(p.site_addr || "(no address)")}</b>
    <span class="mut">${esc(p.site_city || "")} · ${esc(p.county)} · ${esc(USE_NAMES[p.dor_uc] || p.dor_uc)}</span><br>
    ${esc(p.owner_name || "")}<br>
    <span class="mut">${p.bldg_sqft ? fmtN(p.bldg_sqft) + " SF bldg · " : ""}${p._acres ? p._acres.toFixed(1) + " ac" : ""}</span>
    ${p.last_sale_date ? `<br>Last sale ${p.last_sale_date} · ${fmt$(p.last_sale_price)}` : ""}`;
  tip.style.display = "block";
  const rect = document.getElementById("main").getBoundingClientRect();
  tip.style.left = Math.min(e.point.x + 14, rect.width - 300) + "px";
  tip.style.top = (e.point.y + 12) + "px";
}
["pt-circ","poly-fill"].forEach(layer => {
  map.on("mousemove", layer, e => { const p = byKey.get(e.features[0].properties.k); if (p) { showTip(e, p); map.getCanvas().style.cursor = "pointer"; } });
  map.on("mouseleave", layer, () => { tip.style.display = "none"; map.getCanvas().style.cursor = ""; });
  map.on("click", layer, e => openPanel(e.features[0].properties.k));
});

// ---------- detail panel ----------
async function openPanel(key) {
  selectedKey = key; panelKey = key; refreshSources();
  const p = byKey.get(key); if (!p) return;
  const el = document.getElementById("panelInner");
  document.getElementById("panel").classList.add("open");
  el.innerHTML = `<button class="close" onclick="closePanel()">✕</button>
    <h2>${esc(p.site_addr || "(no address)")}</h2>
    <div class="sub">${esc(p.site_city || "")} ${esc(p.site_zip || "")} · ${esc(p.county)} County</div>
    <div class="kv">
      <div>Parcel ID</div><div>${esc(p.parcel_id_raw)}</div>
      <div>Use</div><div>${esc(USE_NAMES[p.dor_uc] || p.dor_uc)} <span class="pill">${esc(p.dor_uc)}</span></div>
      <div>Owner</div><div>${esc(p.owner_name || "—")}</div>
      <div>Owner mailing</div><div>${esc(p.owner_addr || "—")}</div>
      <div>Building</div><div>${p.bldg_sqft ? fmtN(p.bldg_sqft) + " SF" : "—"}${p.year_built ? " · built " + p.year_built : ""}</div>
      <div>Land</div><div>${p._acres ? p._acres.toFixed(2) + " acres" : "—"} ${p.land_sqft ? "(" + fmtN(p.land_sqft) + " SF)" : ""}</div>
      <div>Just value</div><div>${fmt$(p.just_value)}</div>
      <div>Last sale</div><div>${p.last_sale_date ? p.last_sale_date + " · " + fmt$(p.last_sale_price) : "—"}</div>
      <div>Map</div><div><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${p.lat},${p.lon}">Google Maps ↗</a></div>
    </div>
    <h3>Ownership</h3><div id="entBox" class="sub">…</div>
    <h3>Sale history</h3><div id="salesBox" class="sub">loading…</div>
    <h3>Owner names on record</h3><div id="ownBox" class="sub">loading…</div>`;
  renderOwnership(p);
  map.flyTo({ center: [p.lon, p.lat], zoom: Math.max(map.getZoom(), 14.5) });
  try {
    const [sales, owners] = await Promise.all([
      fetch(`${SB}/dash_sales?parcel_key=eq.${encodeURIComponent(key)}&order=sale_date.desc&limit=40`, { headers: H }).then(r => r.json()),
      fetch(`${SB}/dash_owners?parcel_key=eq.${encodeURIComponent(key)}&limit=40`, { headers: H }).then(r => r.json())
    ]);
    if (panelKey !== key) return;
    document.getElementById("salesBox").outerHTML = sales.length ? `<table class="mini"><tr><th>Date</th><th class="num">Price</th><th>Buyer / notes</th></tr>` +
      sales.map(s => `<tr><td>${s.sale_date}</td><td class="num">${fmt$(s.sale_price)}</td>
        <td>${esc(s.grantee || "")}${s.deed_type ? `<br><span class="pill">${esc(s.deed_type)}</span>` : ""}
        ${s.or_book ? ` <span class="pill">OR ${esc(s.or_book)}/${esc(s.or_page || "")}</span>` : ""}
        ${s.is_qualified === false ? ' <span class="pill">unqualified</span>' : ""}</td></tr>`).join("") + "</table>"
      : `<div class="sub">No recorded sales.</div>`;
    const srcName = { NAL: "State roll", PA: "Property Appraiser", CLERK_DEED: "Clerk deed", CLERK_MTG: "Clerk mortgage" };
    document.getElementById("ownBox").outerHTML = owners.length ? `<table class="mini">` +
      owners.map(o => `<tr><td>${esc(o.name_raw)}</td><td class="num"><span class="pill">${esc(srcName[o.source] || o.source)}</span></td></tr>`).join("") + "</table>"
      : `<div class="sub">—</div>`;
  } catch (e) { console.warn(e); }
}
function renderOwnership(p) {
  const box = document.getElementById("entBox");
  if (!box || !p) return;
  if (entFailed) { box.textContent = "Ownership data unavailable."; return; }
  if (!entReady) { box.textContent = "loading…"; return; }
  const e = entities.get(p._norm);
  if (!e) { box.textContent = "No Sunbiz entity match on record."; return; }
  const inactive = e.status && !/^ACT/i.test(e.status);
  let h = `<div class="kv" style="margin:4px 0 8px">
    <div>Sunbiz entity</div><div>${esc(e.matched_name || "—")} <span class="pill${inactive ? " bad" : ""}">${esc(e.status || "?")}</span></div>
    ${e.date_filed ? `<div>Filed</div><div>${esc(e.date_filed)}</div>` : ""}
    ${e.principal_addr ? `<div>Principal addr</div><div>${esc(e.principal_addr)}</div>` : ""}
    ${e.registered_agent ? `<div>Registered agent</div><div>${esc(e.registered_agent)}</div>` : ""}
  </div>`;
  const pr = Array.isArray(e.principals) ? e.principals.filter(x => x && x.name) : [];
  if (pr.length) h += `<table class="mini"><tr><th>Title</th><th>Officer / manager</th></tr>` +
    pr.map(x => `<tr><td>${esc(x.title || "—")}</td><td>${esc(x.name)}</td></tr>`).join("") + "</table>";
  if (e.group_id != null && groups.has(e.group_id)) {
    const g = groups.get(e.group_id);
    const nParcels = parcels.reduce((a, q) => a + (g.members.includes(q._norm) ? 1 : 0), 0);
    h += `<div class="clusterBox"><b>Ownership cluster: ${esc(g.label || "group " + e.group_id)}</b>
      ${g.members.length} related entities · ${nParcels.toLocaleString()} parcels
      ${g.hidden ? ' <span class="pill warn">hidden link</span>' : ""}
      <button class="portBtn" onclick="showPortfolio(${e.group_id})">Show this holder's entire portfolio (${nParcels.toLocaleString()} parcels)</button>
    </div>`;
  }
  box.className = ""; box.innerHTML = h;
}
function closePanel() { document.getElementById("panel").classList.remove("open"); selectedKey = null; panelKey = null; refreshSources(); }
window.closePanel = closePanel;

// ---------- table view ----------
let sortCol = "last_sale_date", sortDir = -1;
document.getElementById("tableBtn").onclick = () => { document.getElementById("tableView").classList.add("open"); renderTable(); };
document.getElementById("tvClose").onclick = () => document.getElementById("tableView").classList.remove("open");
function renderTable() {
  const rows = parcels.filter(p => p._match);
  rows.sort((a, b) => { const x = a[sortCol], y = b[sortCol];
    if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
  document.getElementById("tvCount").textContent = rows.length.toLocaleString() + " parcels";
  const cols = [["site_addr","Address"],["site_city","City"],["county","County"],["owner_name","Owner"],
    ["dor_uc","Use"],["bldg_sqft","Bldg SF"],["_acres","Acres"],["just_value","Just value"],
    ["last_sale_date","Last sale"],["last_sale_price","Price"]];
  document.getElementById("tableWrap").innerHTML = `<table><thead><tr>` +
    cols.map(([k, t]) => `<th data-k="${k}">${t}${sortCol === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") +
    `</tr></thead><tbody>` + rows.slice(0, 3000).map(p => `<tr data-k="${esc(p.parcel_key)}">
      <td>${esc(p.site_addr || "")}</td><td>${esc(p.site_city || "")}</td><td>${p.county}</td>
      <td>${esc(p.owner_name || "")}</td><td>${esc(USE_NAMES[p.dor_uc] || p.dor_uc)}</td>
      <td class="num">${p.bldg_sqft ? fmtN(p.bldg_sqft) : ""}</td>
      <td class="num">${p._acres ? p._acres.toFixed(1) : ""}</td>
      <td class="num">${p.just_value ? fmt$(p.just_value) : ""}</td>
      <td>${p.last_sale_date || ""}</td><td class="num">${p.last_sale_price ? fmt$(p.last_sale_price) : ""}</td>
    </tr>`).join("") + "</tbody></table>";
  document.querySelectorAll("#tableWrap th").forEach(th => th.onclick = () => {
    const k = th.dataset.k; sortDir = sortCol === k ? -sortDir : (k.includes("date") || typeof parcels[0]?.[k] === "number" ? -1 : 1);
    sortCol = k; renderTable(); });
  document.querySelectorAll("#tableWrap tbody tr").forEach(tr => tr.onclick = () => {
    document.getElementById("tableView").classList.remove("open"); openPanel(tr.dataset.k); });
}

// ---------- CSV export ----------
document.getElementById("csvBtn").onclick = () => {
  const cols = ["parcel_key","parcel_id_raw","county","site_addr","site_city","site_zip","dor_uc","owner_name",
    "owner_addr","bldg_sqft","land_sqft","year_built","just_value","last_sale_date","last_sale_price","lat","lon"];
  const rows = parcels.filter(p => p._match);
  const csv = [cols.join(",")].concat(rows.map(p => cols.map(c => {
    let v = p[c]; if (v == null) return ""; v = String(v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "industrial_parcels.csv"; a.click();
};

boot().catch(e => { document.getElementById("loading").textContent = "Load failed: " + e.message; });
</script>
